; PeekBox display — GeekMagic SmallTV Ultra (ESP8266, ST7789 240x240)
;
; Build:   pio run
; Flash:   pio run -t upload --upload-port <port>
; Monitor: pio device monitor --port <port>
; Button probe build (prints candidate GPIO changes on serial):
;          pio run -e smalltv_ultra_probe -t upload --upload-port <port>
;
; Pin sources and open questions: src/board_smalltv_ultra.h

[env:smalltv_ultra]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino

board_build.f_cpu = 160000000L      ; JPEG decoding is CPU bound
board_build.flash_mode = dio        ; 4 MB, DIO, 40 MHz per the SmallTV Ultra flash chip
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200
upload_speed = 115200   ; this unit's CH340 link is unreliable at 460800 (swc-digital notes)
monitor_filters = esp8266_exception_decoder

lib_deps =
	bodmer/TFT_eSPI @ 2.5.43
	bodmer/TJpg_Decoder @ 1.1.0

; TFT_eSPI configured entirely from here (USER_SETUP_LOADED skips User_Setup.h).
build_flags =
	-I ../shared
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_SCLK=14
	-D TFT_MOSI=13
	-D TFT_CS=15
	-D TFT_DC=0
	-D TFT_RST=2
	-D TFT_SPI_MODE=SPI_MODE3
	-D TFT_INVERSION_ON=1
	-D TFT_RGB_ORDER=TFT_RGB
	-D SPI_FREQUENCY=40000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D DISABLE_ALL_LIBRARY_WARNINGS=1   ; silences "TOUCH_CS not defined" (no resistive touch panel)

[env:smalltv_ultra_probe]
extends = env:smalltv_ultra
build_flags =
	${env:smalltv_ultra.build_flags}
	-D PEEKBOX_BUTTON_PROBE=1
