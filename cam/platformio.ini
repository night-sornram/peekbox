; PeekBox camera — AI-Thinker ESP32-CAM (OV2640 + 4 MB PSRAM)
;
; Build:   pio run
; Flash:   pio run -t upload --upload-port <port>     (GPIO0 -> GND while resetting)
; Monitor: pio device monitor --port <port>

[env:esp32cam]
platform = espressif32 @ 8.0.0
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

; huge_app: no OTA slot, leaves room for TLS + camera code in the app partition.
board_build.partitions = huge_app.csv

build_flags =
	-I ../shared
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
